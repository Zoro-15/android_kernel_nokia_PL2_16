name: Build Nokia SDM660 (PL2) Kernel

on:
  workflow_dispatch:
    inputs:
      commit_ref:
        description: 'Git Commit SHA, Branch, or Tag to build (leave empty for latest)'
        required: false
        default: ''
      defconfig:
        description: 'Kernel Defconfig'
        required: true
        default: 'sdm660-perf_defconfig'
        type: choice
        options:
          - sdm660-perf_defconfig
          - sdm660_defconfig
  push:
    branches:
      - lineage-23.2
      - main
      - master
      - bringup*

jobs:
  build:
    name: Compile Kernel with Clang
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Switch to Target Commit (if specified)
        run: |
          # Keep extra/ directory safe before switching commits if needed
          if [ -d "extra" ]; then
            cp -r extra /tmp/extra_backup
          fi

          TARGET_REF="${{ github.event.inputs.commit_ref }}"
          if [ -n "$TARGET_REF" ]; then
            echo "Checking out requested commit/ref: $TARGET_REF"
            git checkout "$TARGET_REF"
          fi

          # Restore extra/ directory if it was wiped by checkout
          if [ ! -d "extra" ] && [ -d "/tmp/extra_backup" ]; then
            cp -r /tmp/extra_backup extra
          fi

          COMMIT_HASH=$(git rev-parse --short HEAD)
          echo "COMMIT_HASH=$COMMIT_HASH" >> $GITHUB_ENV
          echo "Building commit: $COMMIT_HASH"

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib \
            gcc-multilib git gnupg gperf lib32ncurses5-dev lib32readline-dev lib32z1-dev \
            liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 \
            libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev

      - name: Download AOSP Clang (r487747c)
        run: |
          git clone --depth=1 https://gitlab.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r487747c.git clang

      - name: Download GCC Cross-Compilers
        run: |
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git gcc64
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git gcc32

      - name: Build Kernel
        run: |
          DEFCONFIG="${{ github.event.inputs.defconfig || 'sdm660-perf_defconfig' }}"
          echo "Selected Defconfig: $DEFCONFIG"

          export PATH=$(pwd)/clang/bin:$(pwd)/gcc64/bin:$(pwd)/gcc32/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          export CC=clang

          mkdir -p out
          make O=out ARCH=arm64 $DEFCONFIG
          make -j$(nproc --all) O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android- CROSS_COMPILE_ARM32=arm-linux-androideabi- KCFLAGS="-gdwarf-4"

      - name: Repack Flashable Boot Image (Magiskboot with fdsan)
        run: |
          mkdir -p release
          KERNEL_IMAGE="out/arch/arm64/boot/Image.gz-dtb"
          BASE_BOOT="extra/boot_universal.img"

          if [ ! -f "$KERNEL_IMAGE" ]; then
            echo "::error::Kernel image $KERNEL_IMAGE not found!"
            exit 1
          fi

          cp "$KERNEL_IMAGE" "release/Image.gz-dtb"
          if [ -f out/arch/arm64/boot/dtbo.img ]; then
            cp out/arch/arm64/boot/dtbo.img release/
          fi

          if [ -f "$BASE_BOOT" ]; then
            echo ">>> Setting up Magiskboot for repacking..."
            mkdir -p /tmp/repack && cd /tmp/repack
            curl -sL https://github.com/topjohnwu/Magisk/releases/download/v27.0/Magisk-v27.0.apk -o magisk.apk
            unzip -oq magisk.apk "lib/x86_64/libmagiskboot.so" -d .
            mv lib/x86_64/libmagiskboot.so magiskboot
            chmod +x magiskboot
            rm -rf lib magisk.apk

            echo ">>> Unpacking $BASE_BOOT..."
            ./magiskboot unpack "$GITHUB_WORKSPACE/$BASE_BOOT"

            echo ">>> Replacing kernel with freshly compiled Image.gz-dtb..."
            cp "$GITHUB_WORKSPACE/$KERNEL_IMAGE" kernel

            echo ">>> Patching ramdisk with debug.fdsan=warn ONLY..."
            if [ -f ramdisk.cpio ]; then
              ./magiskboot cpio ramdisk.cpio "extract default.prop default.prop" 2>/dev/null || true
              ./magiskboot cpio ramdisk.cpio "extract prop.default prop.default" 2>/dev/null || true

              printf '%s\n' "debug.fdsan=warn" >> adb_props.txt

              if [ -f prop.default ]; then
                cat adb_props.txt >> prop.default
                ./magiskboot cpio ramdisk.cpio "add 0644 prop.default prop.default"
              fi

              if [ -f default.prop ]; then
                cat adb_props.txt >> default.prop
                ./magiskboot cpio ramdisk.cpio "add 0644 default.prop default.prop"
              fi
            fi

            echo ">>> Repacking boot image..."
            BOOT_OUT="boot-PL2-fdsan-only-${COMMIT_HASH}.img"
            ./magiskboot repack "$GITHUB_WORKSPACE/$BASE_BOOT" "$BOOT_OUT"
            if [ -f new-boot.img ]; then
              mv new-boot.img "$BOOT_OUT"
            fi

            cp "$BOOT_OUT" "$GITHUB_WORKSPACE/release/"
            cd "$GITHUB_WORKSPACE"
            echo "✅ Repacked $BOOT_OUT created successfully!"
          else
            echo "::warning::Base boot image $BASE_BOOT not found, skipping repack."
          fi

          echo ">>> Release files:"
          ls -lh release/

      - name: Upload Kernel & Flashable Boot Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nokia-PL2-Kernel-boot-${{ env.COMMIT_HASH || 'build' }}
          path: release/*
